services:
  kerf-api:
    build: .
    image: laser-kerf-compensation:latest
    container_name: laser-kerf-api
    ports:
      # 宿主机端口可通过环境变量 KERF_API_PORT 覆盖，默认 8000
      - "${KERF_API_PORT:-8000}:8000"
    environment:
      # uvicorn worker 进程数（纯计算服务可按 CPU 调整）
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
